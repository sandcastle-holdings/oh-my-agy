name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 shellcheck xxd

      - name: Lint Shell Scripts
        run: |
          shellcheck scripts/title_and_badge.sh
          shellcheck tests/test_hook.sh

      - name: Validate Manifests
        run: |
          jq empty plugin.json
          jq empty hooks.json
          jq empty marketplace.json

      - name: Execute Hook Test Suite
        run: |
          chmod +x scripts/title_and_badge.sh tests/test_hook.sh
          ./tests/test_hook.sh
