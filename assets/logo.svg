<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151921" />
      <stop offset="50%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#07090c" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#43341b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f5c755" stop-opacity="0.9" />
    </linearGradient>

    <!-- Castle Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae082" />
      <stop offset="40%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#aa7a1e" />
    </linearGradient>

    <!-- Terminal Screen Gradient -->
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2330" />
      <stop offset="100%" stop-color="#10151f" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#subtleShadow)" />

  <!-- Subtle Top Highlight Rim -->
  <path d="M 60 10 L 196 10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Sandcastle Structure -->
  <g id="castle" filter="url(#subtleShadow)">
    <!-- Main Castle Wall & Base -->
    <path d="M 52 186 
             L 52 110 
             L 66 110 L 66 122 L 78 122 L 78 110 L 92 110 L 92 126
             L 104 126 L 104 96 
             L 116 96 L 116 108 L 128 108 L 128 96 L 140 96 L 140 108 L 152 108 L 152 96 L 164 96
             L 164 126 L 176 126 
             L 176 110 L 190 110 L 190 122 L 202 122 L 202 110 L 216 110 
             L 216 186 
             Z" 
          fill="url(#goldGrad)" />

    <!-- Castle Tower Highlight Edges -->
    <path d="M 54 112 L 54 184 M 214 112 L 214 184" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />

    <!-- Center Arch / Terminal Window Outer Frame -->
    <path d="M 98 186 L 98 148 C 98 132 170 132 170 148 L 170 186 Z" fill="#0c0e14" />
    
    <!-- Terminal Screen Inner Arch -->
    <path d="M 102 186 L 102 150 C 102 138 166 138 166 150 L 166 186 Z" fill="url(#terminalGrad)" stroke="#2b3445" stroke-width="1.5" />

    <!-- Terminal Header Dots -->
    <circle cx="118" cy="147" r="2" fill="#e06c75" />
    <circle cx="125" cy="147" r="2" fill="#e5c07b" />
    <circle cx="132" cy="147" r="2" fill="#98c379" />

    <!-- Terminal Prompt Prompt Symbol '>' -->
    <path d="M 116 161 L 124 167 L 116 173" 
          stroke="#ffd54f" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" 
          filter="url(#amberGlow)" />

    <!-- Terminal Cursor '_' -->
    <line x1="129" y1="173" x2="140" y2="173" 
          stroke="#ffd54f" 
          stroke-width="3" 
          stroke-linecap="round" 
          filter="url(#amberGlow)" />

    <!-- Castle Windows (Slits) in Left and Right Towers -->
    <rect x="68" y="142" width="6" height="14" rx="3" fill="#151921" stroke="#aa7a1e" stroke-width="1" />
    <rect x="194" y="142" width="6" height="14" rx="3" fill="#151921" stroke="#aa7a1e" stroke-width="1" />

    <!-- Decorative Battlements Bottom Shadow Line -->
    <path d="M 52 186 L 216 186" stroke="#d4af37" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Sparkles / Ambient Accents -->
  <g fill="#ffd54f" opacity="0.85">
    <circle cx="134" cy="62" r="2" filter="url(#amberGlow)" />
    <path d="M 134 54 L 135.5 59.5 L 141 61 L 135.5 62.5 L 134 68 L 132.5 62.5 L 127 61 L 132.5 59.5 Z" />
    <circle cx="68" cy="80" r="1.5" opacity="0.6" />
    <circle cx="200" cy="80" r="1.5" opacity="0.6" />
  </g>
</svg>
